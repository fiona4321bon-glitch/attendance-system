<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>學生出缺勤管理系統</title>

    <link rel="stylesheet"
          href="style.css">
</head>

<body>

    <!-- 登入畫面 -->
    <section id="loginPage">

        <div class="login-box">

            <h1>學生出缺勤管理系統</h1>

            <p>教師登入</p>

            <input
                type="email"
                id="email"
                placeholder="電子郵件">

            <input
                type="password"
                id="password"
                placeholder="密碼">

            <button onclick="login()">
                登入
            </button>

            <button
                class="secondary"
                onclick="register()">
                第一次使用／建立帳號
            </button>

            <p id="loginMessage"></p>

        </div>

    </section>


    <!-- 系統主畫面 -->
    <section
        id="appPage"
        style="display:none;">

        <header>

            <div>

                <h1>學生出缺勤管理</h1>

                <span id="userEmail"></span>

            </div>

            <button onclick="logout()">
                登出
            </button>

        </header>


        <!-- 功能選單 -->

        <nav>

            <button onclick="showPage('attendancePage')">
                今日點名
            </button>

            <button onclick="showPage('classPage')">
                班級管理
            </button>

            <button onclick="showPage('studentPage')">
                學生管理
            </button>

        </nav>


        <!-- 每日點名 -->

        <main id="attendancePage"
              class="page">

            <h2>今日點名</h2>

            <div class="toolbar">

                <label>
                    日期
                </label>

                <input
                    type="date"
                    id="attendanceDate">

                <label>
                    班級
                </label>

                <select
                    id="attendanceClass"
                    onchange="loadAttendanceStudents()">
                </select>

            </div>

            <div id="attendanceSummary">
            </div>

            <div id="attendanceList">
            </div>

            <button
                class="save-button"
                onclick="saveAttendance()">

                儲存出缺勤

            </button>

        </main>


        <!-- 班級管理 -->

        <main
            id="classPage"
            class="page"
            style="display:none;">

            <h2>班級管理</h2>

            <div class="card">

                <h3>新增班級</h3>

                <input
                    id="schoolYear"
                    placeholder="學年度，例如 115">

                <input
                    id="className"
                    placeholder="班級，例如 401">

                <button onclick="addClass()">
                    新增班級
                </button>

            </div>

            <div class="card">

                <h3>目前班級</h3>

                <div id="classList">
                </div>

            </div>

        </main>


        <!-- 學生管理 -->

        <main
            id="studentPage"
            class="page"
            style="display:none;">

            <h2>學生管理</h2>

            <div class="card">

                <label>
                    班級
                </label>

                <select
                    id="studentClass"
                    onchange="loadStudents()">
                </select>

            </div>


            <div class="card">

                <h3>新增學生</h3>

                <input
                    type="number"
                    id="seatNo"
                    placeholder="座號">

                <input
                    id="studentName"
                    placeholder="學生姓名">

                <button onclick="addStudent()">
                    新增學生
                </button>

            </div>


            <div class="card">

                <h3>學生名單</h3>

                <div id="studentList">
                </div>

            </div>

        </main>

    </section>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- 我們自己的程式 -->

    <script src="js/config.js"></script>

    <script src="js/supabase.js"></script>

    <script src="js/auth.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
