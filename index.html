<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        學生出缺勤管理系統
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =====================================================
     登入頁
===================================================== -->

<section id="loginPage">

    <div class="login-box">

        <h1>
            學生出缺勤管理系統
        </h1>

        <p>
            教師登入
        </p>


        <input
            type="email"
            id="email"
            placeholder="電子郵件"
        >


        <input
            type="password"
            id="password"
            placeholder="密碼"
        >


        <div class="login-buttons">

            <button
                onclick="login()"
            >
                登入
            </button>


            <button
                class="secondary"
                onclick="sendPasswordReset()"
            >
                忘記密碼
            </button>


            <button
                class="secondary"
                onclick="register()"
            >
                第一次使用／建立帳號
            </button>

        </div>


        <p id="loginMessage"></p>

    </div>

</section>



<!-- =====================================================
     密碼重設頁
===================================================== -->

<section
    id="resetPasswordPage"
    style="
        display:none;
        min-height:100vh;
        justify-content:center;
        align-items:center;
        padding:20px;
    "
>

    <div class="login-box">

        <h1>
            設定新密碼
        </h1>

        <p>
            請輸入新的登入密碼。
        </p>


        <input
            type="password"
            id="newPassword"
            placeholder="新密碼"
        >


        <input
            type="password"
            id="confirmNewPassword"
            placeholder="再次輸入新密碼"
        >


        <button
            onclick="updatePassword()"
        >
            儲存新密碼
        </button>


        <p id="resetMessage"></p>

    </div>

</section>



<!-- =====================================================
     主系統
===================================================== -->

<section
    id="appPage"
    style="display:none;"
>


    <!-- 頁首 -->

    <header>

        <div>

            <h1>
                學生出缺勤管理
            </h1>

            <span id="userEmail"></span>

        </div>


        <button
            onclick="logout()"
        >
            登出
        </button>

    </header>



    <!-- =================================================
         主選單
    ================================================= -->

    <nav>

        <button
            onclick="showPage('attendancePage')"
        >
            今日點名
        </button>


        <button
            onclick="showPage('recordPage')"
        >
            紀錄查詢
        </button>


        <button
            onclick="showPage('classPage')"
        >
            班級管理
        </button>


        <button
            onclick="showPage('studentPage')"
        >
            學生管理
        </button>

    </nav>



    <!-- =================================================
         今日點名
    ================================================= -->

    <main
        id="attendancePage"
        class="page"
    >

        <h2>
            今日點名
        </h2>


        <div class="card">

            <div class="toolbar">

                <label>

                    日期

                    <input
                        type="date"
                        id="attendanceDate"
                    >

                </label>


                <label>

                    班級

                    <select
                        id="attendanceClass"
                        onchange="loadAttendanceStudents()"
                    >
                    </select>

                </label>

            </div>

        </div>



        <div
            id="attendanceSummary"
            class="summary-block"
        >
        </div>



        <div id="attendanceList">
        </div>



        <button
            class="save-button"
            onclick="saveAttendance()"
        >
            儲存出缺勤
        </button>

    </main>



    <!-- =================================================
         紀錄查詢
    ================================================= -->

    <main
        id="recordPage"
        class="page"
        style="display:none;"
    >

        <h2>
            出缺勤紀錄查詢
        </h2>



        <div class="card">

            <h3>
                選擇班級
            </h3>


            <div class="toolbar">

                <label>

                    班級

                    <select
                        id="recordClass"
                        onchange="loadRecordStudents()"
                    >
                    </select>

                </label>

            </div>

        </div>



        <!-- 某日紀錄 -->

        <div class="card">

            <h3>
                某日出缺勤紀錄
            </h3>


            <div class="toolbar">

                <label>

                    日期

                    <input
                        type="date"
                        id="recordDate"
                    >

                </label>


                <button
                    onclick="loadDateRecords()"
                >
                    查詢當日紀錄
                </button>

            </div>


            <div
                id="dateRecordList"
                class="record-result"
            >

                <p>
                    請選擇日期後查詢。
                </p>

            </div>

        </div>



        <!-- 個別學生紀錄 -->

        <div class="card">

            <h3>
                個別學生紀錄
            </h3>


            <div class="toolbar">

                <label>

                    學生

                    <select id="recordStudent">
                    </select>

                </label>


                <button
                    onclick="loadStudentHistory()"
                >
                    查詢學生紀錄
                </button>

            </div>


            <div
                id="studentHistoryList"
                class="record-result"
            >

                <p>
                    請選擇學生。
                </p>

            </div>

        </div>



        <!-- 班級統計 -->

        <div class="card">

            <h3>
                班級出缺勤統計
            </h3>


            <button
                onclick="loadClassSummary()"
            >
                更新班級統計
            </button>


            <div
                id="classSummary"
                class="record-result"
            >

                <p>
                    尚未載入統計資料。
                </p>

            </div>

        </div>

    </main>



    <!-- =================================================
         班級管理
    ================================================= -->

    <main
        id="classPage"
        class="page"
        style="display:none;"
    >

        <h2>
            班級管理
        </h2>



        <div class="card">

            <h3>
                新增班級
            </h3>


            <div class="toolbar">

                <input
                    id="schoolYear"
                    placeholder="學年度，例如 115"
                >


                <input
                    id="className"
                    placeholder="班級，例如 401"
                >


                <button
                    onclick="addClass()"
                >
                    新增班級
                </button>

            </div>

        </div>



        <div class="card">

            <h3>
                目前班級
            </h3>

            <div id="classList">
            </div>

        </div>

    </main>



    <!-- =================================================
         學生管理
    ================================================= -->

    <main
        id="studentPage"
        class="page"
        style="display:none;"
    >

        <h2>
            學生管理
        </h2>



        <div class="card">

            <h3>
                選擇班級
            </h3>


            <select
                id="studentClass"
                onchange="loadStudents()"
            >
            </select>

        </div>



        <!-- 批次匯入 -->

        <div class="card">

            <h3>
                批次匯入學生
            </h3>


            <p>
                可直接從 Google 試算表複製「座號、姓名」兩欄後貼上。
            </p>


            <textarea
                id="batchStudentData"
                rows="10"
                placeholder="例如：
1	王小明
2	李小華
3	陳小美"
            ></textarea>


            <button
                onclick="batchImportStudents()"
            >
                批次匯入學生
            </button>

        </div>



        <!-- 新增單一學生 -->

        <div class="card">

            <h3>
                新增學生
            </h3>


            <div class="toolbar">

                <input
                    type="number"
                    id="seatNo"
                    min="1"
                    placeholder="座號"
                >


                <input
                    id="studentName"
                    placeholder="學生姓名"
                >


                <button
                    onclick="addStudent()"
                >
                    新增學生
                </button>

            </div>

        </div>



        <div class="card">

            <h3>
                學生名單
            </h3>


            <div id="studentList">

                <p>
                    目前尚未建立學生。
                </p>

            </div>

        </div>

    </main>

</section>



<!-- =====================================================
     Supabase
===================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>



<script src="js/config.js"></script>

<script src="js/supabase.js"></script>

<!-- 加版本號，避免瀏覽器抓舊檔案 -->
<script src="js/auth.js?v=20260914-1"></script>

<script src="js/app.js?v=20260914-2"></script>


</body>

</html>
